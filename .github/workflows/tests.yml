name: tests

on:
  push:
  pull_request:
  schedule:
    # Daily real end-to-end smoke test (see the e2e job below). This trigger
    # applies to the whole workflow, but the e2e job is the only one gated to
    # actually run on it -- the fast unit-test job below explicitly skips
    # schedule/dispatch runs so it doesn't duplicate on push/PR.
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  test:
    # Fast unit tests: every push and PR, not on the daily schedule (that's
    # what the e2e job below is for).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest exercises the Linux code paths (specs.py's /proc/meminfo
        # branch); macos-latest is a real Apple Silicon (arm64) GitHub-hosted
        # runner, exercising the sysctl/darwin branches. Both are free for
        # public repos regardless of OS multiplier.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v

  e2e:
    # Real end-to-end smoke test: downloads an actual (tiny) model, starts a
    # real mlx_lm.server, and verifies opencode gets a real, non-empty reply
    # through it -- via opencode's non-interactive `run` mode, which is
    # scriptable (unlike its default full-screen TUI). This is deliberately
    # NOT part of the fast unit-test job: it needs real network + real Metal
    # compute, so it only runs on the daily schedule or a manual trigger,
    # never on every push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest  # real Apple Silicon required for MLX
    timeout-minutes: 20
    env:
      YOJIT_HOME: ${{ github.workspace }}/.e2e-models
      TEST_MODEL: mlx-community/LFM2.5-1.2B-Instruct-4bit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yojit and mlx-lm
        run: |
          pip install -e .
          pip install mlx-lm

      - name: Install opencode
        run: brew install anomalyco/tap/opencode

      - name: Seed opencode.json so install-time sync actually writes to it
        # opencode_sync.sync() (called by `yojit install` below) is a no-op
        # if opencode.json doesn't exist yet, and a fresh opencode install
        # doesn't create one on its own -- so without this, the "local"
        # provider block never gets written and every later step that
        # talks to opencode has nothing to work with.
        run: |
          mkdir -p ~/.config/opencode
          echo '{}' > ~/.config/opencode/opencode.json

      - name: Install a tiny real model (~0.6GB, kept small for CI speed)
        run: |
          yojit install "$TEST_MODEL"
          ls -la "$YOJIT_HOME/store/mlx/"
          ls -la "$YOJIT_HOME/store/mlx/${TEST_MODEL//\//__}" 2>/dev/null || echo "Model not in expected location"

      - name: Verify model is accessible
        run: |
          echo "Testing if model files exist..."
          ls -la "$YOJIT_HOME/store/mlx/"
          ls -la "$YOJIT_HOME/store/mlx/${TEST_MODEL//\//__}"/*.safetensors 2>/dev/null || echo "No safetensors found"

      - name: Serve it (real launch + real warm-up verification)
        run: yojit serve --no-open

      - name: Verify opencode.json was synced with the local provider
        run: |
          echo "=== opencode.json after install/serve ==="
          cat ~/.config/opencode/opencode.json
          echo "=== end opencode.json ==="
          MODEL_PATH="$YOJIT_HOME/$(jq -r --arg id "$TEST_MODEL" '.models[$id].store_path' "$YOJIT_HOME/manifest.json")"
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          jq -e --arg key "$MODEL_PATH" '.provider.local.models[$key]' ~/.config/opencode/opencode.json

      - name: Ask opencode to say hi and verify a real, non-empty reply
        run: |
          echo "=== Running opencode ==="
          OUT=$(opencode run "Say hi in one word." -m "local/$MODEL_PATH" --format json)
          echo "$OUT"
          echo "=== opencode output above ==="
          # --format json is JSONL (one event object per line), documented
          # event types include "error" and "text" (with the reply text at
          # .part.text). Fail the job (not just log) if we saw an explicit
          # error event, or never saw a non-empty text event -- either means
          # the request never produced a real completion through the server.
          if echo "$OUT" | jq -es 'any(.[]; .type == "error")'; then
            echo "opencode reported an error event" >&2
            exit 1
          fi
          echo "$OUT" | jq -es '[.[] | select(.type == "text") | .part.text] | join("") | select(length > 0)' > /dev/null

          echo "=== Testing direct curl to server ==="
          CURL_OUT=$(curl -sf http://localhost:8080/v1/chat/completions -H "Content-Type: application/json" \
            -d "$(jq -n --arg m "$MODEL_PATH" '{model: $m, messages: [{role: "user", content: "hi"}], stream: false}")")
          echo "$CURL_OUT"
          echo "=== curl output above ==="
          echo "$CURL_OUT" | jq -e '.choices[0].message.content | select(length > 0)' > /dev/null

      - name: Stop the server
        if: always()
        run: yojit stop || true
