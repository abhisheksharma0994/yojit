[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yojit"
version = "0.1.0"
description = "Yojit -- Local AI, set up right. One command to discover, install, run, and keep local LLMs (MLX + llama.cpp) wired into opencode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub>=0.20",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "vulture>=2.11",
    "radon>=6.0",
    "xenon>=0.9",
]

[project.scripts]
yojit = "yojit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sort, pyupgrade, mccabe complexity, pylint-refactor
select = ["E", "F", "I", "UP", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6  # Backend.launch()'s signature is shared across 3 implementations

[tool.vulture]
paths = ["src/yojit"]
min_confidence = 80
